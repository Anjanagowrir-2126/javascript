<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Dice Prediction</h2>

    <button onclick="dice()">Click here</button>

    <p id="demo"></p>

    <script>

        function dice() {
            let userDice = getdice();
            let computerDice = getdice2();

            document.getElementById("demo").innerHTML =
            "By User: " + userDice + "<br>" +
            "Generated by Computer: " + computerDice;
        }

        function getdice() {
            return Math.floor(Math.random() * 6) + 1;
        }

        function getdice2() {
            return Math.floor(Math.random() * 6) + 1;
        }

    </script>

</body>
</html>
