<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Document</title>
</head>
<body>

<h2>Addition</h2>
<label>Enter A :
<textarea id="AddInput" rows="1" cols="10"></textarea><br><br>
</label>
<label>Enter B :
<textarea id="Add2" rows="1" cols="10"></textarea>
</label><br><br>

<button onclick="Addition()">Submit</button><br><br>

<div id="result"></div>

<script>
function Addition() {
    var x = Number(document.getElementById("AddInput").value);
    var y = Number(document.getElementById("Add2").value);

    var sum = x + y;

    document.getElementById("result").innerHTML = "Sum = " + sum;
}
    
</script>
